# One-click job that copies all images (and the font) from Wix into this repository.
# Run it from GitHub: Actions tab -> "Copy images from Wix" -> Run workflow.
name: Copy images from Wix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run fetch-media
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/media public/fonts
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Copy images and font from Wix"
          git push
